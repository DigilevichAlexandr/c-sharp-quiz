<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>.NET Quiz</title>
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <span class="chip">GitHub Pages</span>
      <h1>Сложная викторина по .NET</h1>
      <p>300 вопросов. Подача по одному в случайном порядке, без повторов уже пройденных.</p>
    </section>

    <section class="progress" id="progress-bar"></section>

    <form id="quiz-form" class="quiz"></form>

    <div class="actions">
      <button id="submit-btn" type="button">Ответить</button>
      <button id="next-btn" type="button" class="secondary hidden">Следующий вопрос</button>
      <button id="reset-progress-btn" type="button" class="secondary">Сбросить прогресс</button>
    </div>

    <section id="result" class="result hidden"></section>
  </main>

  <script src="./quiz.js"></script>
</body>
</html>
